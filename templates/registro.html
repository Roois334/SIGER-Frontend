{% extends "base.html" %}
{% block title %}Crear cuenta — SIGER{% endblock %}
{% block content %}
{% set v = v or {} %}

<div class="lw">
  <div class="lc animate-in">

    <div class="llogo">
      <div class="lring">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      </div>
      <h1 class="ltitle">Crear cuenta</h1>
      <p class="lsub">Regístrate como ciudadano de la Sabana de Occidente</p>
    </div>

    <form method="POST" data-vf>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="lrow2">
        <div class="lfg">
          <label class="lfl">Nombre</label>
          <div class="liw">
            <input type="text" name="nombre" class="lfi" style="padding-left:13px" placeholder="Tu nombre" maxlength="80" autocomplete="given-name" data-val="nombre" value="{{ v.get('nombre', '') }}" required>
          </div>
        </div>
        <div class="lfg">
          <label class="lfl">Apellido</label>
          <div class="liw">
            <input type="text" name="apellido" class="lfi" style="padding-left:13px" placeholder="Tu apellido" maxlength="80" autocomplete="family-name" data-val="nombre" value="{{ v.get('apellido', '') }}" required>
          </div>
        </div>
      </div>

      <div class="lfg">
        <label class="lfl">Correo electrónico</label>
        <div class="liw">
          <svg class="lic" viewBox="0 0 24 24" fill="none" width="15" height="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
          <input type="email" name="email" class="lfi" placeholder="tu@correo.com" autocomplete="email" maxlength="120" data-val="email" value="{{ v.get('email', '') }}" required>
        </div>
      </div>

      <div class="lrow2">
        <div class="lfg">
          <label class="lfl">Tipo de documento</label>
          <div class="liw">
            <select name="tipo_documento" id="reg-tipo" class="lfi" style="padding-left:13px" required>
              <option value="" disabled {{ '' if v.get('tipo_documento') else 'selected' }}>Selecciona</option>
              {% for cod, nom in tipos_documento %}
              <option value="{{ cod }}" {{ 'selected' if v.get('tipo_documento') == cod }}>{{ cod }} · {{ nom }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="lfg">
          <label class="lfl">Número de documento</label>
          <div class="liw">
            <input type="text" name="documento" class="lfi" style="padding-left:13px" placeholder="Sin puntos ni espacios" inputmode="numeric" data-val="documento" data-tipo="#reg-tipo" value="{{ v.get('documento', '') }}" required>
          </div>
        </div>
      </div>

      <div class="lfg">
        <label class="lfl">Teléfono celular</label>
        <div class="liw">
          <input type="tel" name="telefono" class="lfi" style="padding-left:13px" placeholder="3001234567" inputmode="numeric" autocomplete="tel" data-val="telefono" value="{{ v.get('telefono', '') }}" required>
        </div>
      </div>

      <div class="lfg">
        <label class="lfl">Municipio</label>
        <div class="liw">
          <select name="municipio" class="lfi" style="padding-left:13px" required>
            <option value="" disabled selected>Selecciona tu municipio</option>
            {% for m in municipios %}
            <option value="{{ m }}" {{ 'selected' if v.get('municipio') == m }}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="lfg">
        <label class="lfl">Contraseña</label>
        <div class="liw">
          <input type="password" name="password" id="reg-pass" class="lfi lfi-r" style="padding-left:13px" placeholder="Crea una contraseña segura" maxlength="128" autocomplete="new-password" data-pw-check required>
          <button type="button" class="leye" data-eye aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="lfg">
        <label class="lfl">Confirmar contraseña</label>
        <div class="liw">
          <input type="password" name="confirmar" class="lfi lfi-r" style="padding-left:13px" placeholder="Repite la contraseña" maxlength="128" autocomplete="new-password" data-pw-confirm="#reg-pass" required>
          <button type="button" class="leye" data-eye aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <button type="submit" class="lbtn">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Crear cuenta
      </button>
    </form>

    <div class="lfoot">
      ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="lalink">Inicia sesión</a>
    </div>
  </div>
</div>

{% endblock %}
