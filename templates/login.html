{% extends "base.html" %}
{% block title %}Ingresar - SIGER{% endblock %}
{% block content %}

<div class="lw">
  <div class="lc animate-in">

    <div class="llogo">
      <div class="lring">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4.5 8-11.5V5l-8-3-8 3v5.5C4 17.5 12 22 12 22z"/><path d="M12 8v5"/><circle cx="12" cy="16" r=".6" fill="currentColor" stroke="none"/></svg>
      </div>
      <h1 class="ltitle">SIGER</h1>
      <p class="lsub">Ingresa a tu cuenta</p>
    </div>

    <form method="POST">
      <div class="lfg">
        <label class="lfl">Correo electronico</label>
        <div class="liw">
          <svg class="lic" viewBox="0 0 24 24" fill="none" width="15" height="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
          <input type="email" name="email" id="emailInp" class="lfi" placeholder="tu@correo.com" autocomplete="email" inputmode="email" required>
        </div>
      </div>
      <div class="lfg">
        <label class="lfl">Contrasena</label>
        <div class="liw">
          <svg class="lic" viewBox="0 0 24 24" fill="none" width="15" height="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" name="password" id="pwInp" class="lfi lfi-r" placeholder="********" autocomplete="current-password" required>
          <button type="button" class="leye" onclick="togglePw()">
            <svg id="eyeO" viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeC" viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="lbtn">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Ingresar
      </button>
    </form>

    <div class="lfoot">
      No tienes cuenta? <a href="{{ url_for('registro') }}" class="lalink">Registrate como ciudadano</a>
    </div>
  </div>
</div>

<script>
function togglePw() {
  var i = document.getElementById('pwInp'), o = document.getElementById('eyeO'), c = document.getElementById('eyeC');
  if (i.type === 'password') { i.type = 'text'; o.style.display = 'none'; c.style.display = 'block'; }
  else { i.type = 'password'; o.style.display = 'block'; c.style.display = 'none'; }
}
</script>

{% endblock %}
