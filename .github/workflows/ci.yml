# Integracion continua del FRONTEND: compilacion, pruebas de seguridad del login/HTTPS y analisis de SonarQube.
#  - Se ejecuta en cada Pull Request hacia main y en cada push a cualquier rama que no sea main.
#  - Tambien lo llama publicar-azure.yml antes de desplegar: si algo falla aqui, NO se publica.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false

permissions:
  contents: read

jobs:
  pruebas-y-calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Comprobar que todo el codigo compila
        run: python -m compileall -q app.py config.py utilities

      - name: Pruebas y cobertura
        run: python -m pytest --cov --cov-config=.coveragerc --cov-report=term-missing:skip-covered --cov-report=xml --junitxml=junit.xml

      - name: Guardar informes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-frontend
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

      - name: Analisis de SonarQube
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v7

      - name: Aviso - SonarQube omitido
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: echo "::warning title=SonarQube omitido::Define los secretos SONAR_TOKEN y SONAR_HOST_URL en GitHub (Settings > Secrets and variables > Actions)."
