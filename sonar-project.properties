# SonarQube - SIGER Frontend (Flask + Jinja + JavaScript). Lo lee sonarqube-scan-action desde la raiz del repositorio.
# SonarQube Cloud: organizacion y clave del proyecto (copialas tal cual de la pagina del proyecto en sonarcloud.io)
sonar.organization=roois334
sonar.projectKey=roois334_SIGER-Frontend
sonar.projectName=SIGER Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=app.py,config.py,utilities,static/js,templates
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=**/__pycache__/**,venv/**,_respaldo_codigo/**,instance/**,static/css/**,static/img/**
# JavaScript y plantillas no se miden con pytest
sonar.coverage.exclusions=static/js/**,templates/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

sonar.qualitygate.wait=true
